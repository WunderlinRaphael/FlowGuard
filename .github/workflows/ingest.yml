name: Ingest

# Every hour at minute 17 (UTC), and by hand from the Actions tab.
# Scheduled runs only start from the default branch.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Runs never overlap: a second run waits for the first one to finish
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FLOWGUARD_STORE: ${{ vars.FLOWGUARD_STORE }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
      - run: uv sync --locked --no-dev
      # Writes the key to a temporary file and sets GOOGLE_APPLICATION_CREDENTIALS,
      # which the Google Cloud Storage filesystem of pyarrow picks up.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ vars.GCP_PROJECT }}
      - run: uv run python -m flowguard.features.ingest

  # Runs after the ingest job. A failing build never changes the result of the ingest job,
  # so the data collection stays green. Same concurrency group as features.yml: a manual
  # full build and this one never write at the same time.
  features:
    needs: ingest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: features
      cancel-in-progress: false
    env:
      FLOWGUARD_STORE: ${{ vars.FLOWGUARD_STORE }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
      - run: uv sync --locked --no-dev
      # Writes the key to a temporary file and sets GOOGLE_APPLICATION_CREDENTIALS,
      # which the Google Cloud Storage filesystem of pyarrow picks up.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ vars.GCP_PROJECT }}
      # First day of the previous month (UTC). Start from the 1st of this month so that
      # "minus one month" never lands on a day that does not exist (for example 31 March).
      - name: Window start
        run: echo "SINCE=$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%F)" >> "$GITHUB_ENV"
      # GITHUB_SHA is set by Actions and ends up as code_version in the manifest.
      # bash runs with pipefail here, so a failing build fails the step despite tee.
      - name: Build features
        shell: bash
        run: uv run python -m flowguard.features.build --since "$SINCE" | tee build_report.txt
      - name: Build report in the job summary
        if: always()
        run: |
          if [ -f build_report.txt ]; then
            {
              echo "### Feature build since $SINCE"
              echo '```'
              cat build_report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

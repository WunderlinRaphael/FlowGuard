[project]
name = "flowguard"
version = "0.1.0"
description = "24-hour water level forecasts and risk bands for BAFU river gauges in canton Uri"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
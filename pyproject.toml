[project]
name = "flowguard"
version = "0.1.0"
description = "24-hour water level forecasts and risk bands for BAFU river gauges in canton Uri"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "requests",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
train = [
    "lightgbm==4.7.0",
    "mlflow==3.18.0",
    "scikit-learn==1.9.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
